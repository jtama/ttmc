title: Accessibilité Web
questions:
  - question: |
      Vrai ou Faux : Écrire en tout petit facilite la lecture.
    answer: |
      ❌ **Faux !** Un texte suffisamment grand est plus facile à lire.

  - question: |
      Vrai ou Faux : Les sous-titres permettent de comprendre une vidéo sans entendre le son.
    answer: |
      ✅ **Vrai !** On peut lire ce qui est dit.

  - question: |
      Vrai ou Faux : Tout le monde utilise une souris pour naviguer sur Internet.
    answer: |
      ❌ **Faux !** Certaines personnes utilisent un clavier ou d'autres outils.

  - question: |
      Vrai ou Faux : Un texte noir sur un fond blanc est plus facile à lire qu'un texte gris clair sur un fond blanc.
    answer: |
      ✅ **Vrai !** Le texte noir se distingue mieux du fond blanc.

  - question: |
      Vrai ou Faux : Pour signaler une erreur dans un formulaire, il suffit de mettre le champ en rouge, sans aucun message.
    answer: |
      ❌ **Faux !** Certaines personnes distinguent mal les couleurs. Un message permet de comprendre l'erreur.

  - question: |
      Vrai ou Faux : Un lien intitulé « Télécharger le menu du restaurant » est plus clair qu'un lien intitulé « Cliquez ici ».
    answer: |
      ✅ **Vrai !** Le texte du lien explique directement ce qui se passe quand on clique dessus.

  - question: |
      Lorsqu'une modale est ouverte, où doit rester le focus clavier ?
    answer: |
      **À l'intérieur de la modale, jusqu'à sa fermeture !** Une boîte de dialogue modale doit gérer le focus afin que l'utilisateur n'interagisse pas avec le contenu situé derrière elle.

  - question: |
      Quel attribut permet à un lecteur d'écran d'annoncer une information mise à jour dynamiquement, sans déplacer le focus dessus ?
    answer: |
      **`aria-live` !** Une région live permet d'annoncer certains changements dynamiques sans nécessiter de déplacement du focus.

  - question: |
      Vrai ou Faux : Ajouter un attribut ARIA à un composant HTML natif rend systématiquement ce composant plus accessible.
    answer: |
      ❌ **Faux !** Un mauvais usage d'ARIA peut dégrader l'accessibilité d'un composant déjà correctement sémantique.

  - question: |
      👾 **BOSS FINAL :**

      Un utilisateur clique sur ce bouton. Que se passe-t-il ?

      ```html
      <button aria-disabled="true">
        Supprimer
      </button>
      ```
    answer: |
      **Le clic fonctionne, l'action se déclenche !** `aria-disabled="true"` annonce l'état aux technologies d'assistance mais n'empêche pas à lui seul l'activation du bouton. Il faut bloquer l'action en JavaScript, ou utiliser l'attribut `disabled`.
