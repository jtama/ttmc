title: Base de données
questions:
  - question: |
      Vrai ou Faux : Une base de données sert à stocker des informations.
    answer: |
      ✅ **Vrai !** Elle permet de conserver des informations, comme des noms ou des scores.

  - question: |
      Vrai ou Faux : Une base de données peut enregistrer les scores des joueurs d'un jeu vidéo.
    answer: |
      ✅ **Vrai !** Elle peut conserver le nom de chaque joueur et son score.

  - question: |
      Vrai ou Faux : Pour retrouver une information dans une base de données, il faut forcément tout lire à la main.
    answer: |
      ❌ **Faux !** On peut demander à l'ordinateur de rechercher l'information pour nous.

  - question: |
      Vrai ou Faux : Une base de données peut contenir une liste de contacts.
    answer: |
      ✅ **Vrai !** Elle peut conserver des noms et des numéros de téléphone.

  - question: |
      Vrai ou Faux : Une base de données peut contenir uniquement des nombres.
    answer: |
      ❌ **Faux !** Elle peut aussi contenir du texte, comme des noms ou des adresses.

  - question: |
      Vrai ou Faux : On peut modifier une adresse enregistrée dans une base de données.
    answer: |
      ✅ **Vrai !** On peut mettre les informations à jour, par exemple après un déménagement.

  - question: |
      Que calcule cette requête ?

      ```sql
      SELECT team, AVG(score)
      FROM players
      GROUP BY team;
      ```
    answer: |
      **Le score moyen de chaque équipe !** `GROUP BY` regroupe les joueurs par équipe et `AVG(score)` calcule le score moyen de chacune.

  - question: |
      Comment appelle-t-on un ensemble d'instructions enregistré dans la base de données et exécuté à la demande ?
    answer: |
      **Une procédure stockée !** Elle permet de regrouper une logique exécutée côté base de données.

  - question: |
      Dans le standard SQL, quel niveau d'isolation empêche les « lectures fantômes », ces nouvelles lignes ajoutées par une autre transaction qui apparaissent quand on répète une même requête ?
    answer: |
      **SERIALIZABLE !** Selon le standard SQL, **REPEATABLE READ** peut encore autoriser des lectures fantômes. Certains systèmes, comme PostgreSQL, offrent toutefois des garanties plus fortes à ce niveau.

  - question: |
      👾 **BOSS FINAL :**

      Quelle forme normale cherche à éviter qu'un attribut non-clé dépende transitivement d'une clé via un autre attribut non-clé ?
    answer: |
      **La troisième forme normale (3NF) !** Elle vise notamment à éliminer les dépendances transitives entre attributs non-clés.
