title: Base de données
questions:
  - question: |
      Vrai ou Faux : Une base de données sert à stocker des informations.
    answer: |
      ✅ **Vrai !** Elle permet de conserver des informations, comme des noms ou des scores.

  - question: |
      Vrai ou Faux : Une base de données peut enregistrer les scores des joueurs d'un jeu vidéo.
    answer: |
      ✅ **Vrai !** Elle peut conserver le nom de chaque joueur et son score.

  - question: |
      Vrai ou Faux : Pour retrouver une information dans une base de données, il faut forcément tout lire à la main.
    answer: |
      ❌ **Faux !** On peut demander à l'ordinateur de rechercher l'information pour nous.

  - question: |
      Vrai ou Faux : Une base de données peut contenir une liste de contacts.
    answer: |
      ✅ **Vrai !** Elle peut conserver des noms et des numéros de téléphone.

  - question: |
      Vrai ou Faux : Une base de données peut contenir uniquement des nombres.
    answer: |
      ❌ **Faux !** Elle peut aussi contenir du texte, comme des noms ou des adresses.

  - question: |
      Vrai ou Faux : On peut modifier une adresse enregistrée dans une base de données.
    answer: |
      ✅ **Vrai !** On peut mettre les informations à jour, par exemple après un déménagement.

  - question: |
      Vrai ou Faux : `GROUP BY` permet de regrouper des lignes afin d'effectuer des calculs par groupe.

      ```sql
      SELECT team, AVG(score)
      FROM players
      GROUP BY team;
      ```
    answer: |
      ✅ **Vrai !** Ici, les joueurs sont regroupés par équipe et `AVG(score)` calcule le score moyen de chacune.

  - question: |
      Vrai ou Faux : Une procédure stockée est un ensemble d'instructions enregistré dans la base de données et pouvant être exécuté à la demande.
    answer: |
      ✅ **Vrai !** Une procédure stockée permet de regrouper une logique exécutée côté base de données.

  - question: |
      Vrai ou Faux : Le niveau d'isolation **REPEATABLE READ** garantit, dans tous les systèmes de bases de données, qu'une même requête ne pourra jamais retourner de nouvelles lignes ajoutées par une autre transaction.
    answer: |
      ❌ **Faux !** Selon le standard SQL, **REPEATABLE READ** peut encore autoriser des « lectures fantômes » : de nouvelles lignes peuvent apparaître lorsqu'une requête est répétée. Certains systèmes offrent toutefois des garanties plus fortes à ce niveau. **SERIALIZABLE** empêche ce phénomène.

  - question: |
      👾 **BOSS FINAL — Vrai ou Faux :**

      La troisième forme normale (**3NF**) cherche notamment à éviter qu'un attribut non-clé dépende transitivement d'une clé via un autre attribut non-clé.
    answer: |
      ✅ **Vrai !** La troisième forme normale vise notamment à éliminer les dépendances transitives problématiques entre attributs non-clés.
