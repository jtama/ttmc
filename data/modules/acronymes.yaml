title: Acronymes
questions:
  - question: |
      Vrai ou Faux : le « U » de **USB** signifie « Universel ».
    answer: |
      ✅ **Vrai !** USB signifie **Universal Serial Bus**.

  - question: |
      Vrai ou Faux : le « H » de **HTML** signifie « HyperText ».
    answer: |
      ✅ **Vrai !** HTML signifie **HyperText Markup Language**.

  - question: |
      Vrai ou Faux : **CSS** signifie `Computer Style Sheets`.
    answer: |
      ❌ **Faux !** CSS signifie **Cascading Style Sheets**, soit « feuilles de style en cascade ».

  - question: |
      Vrai ou Faux : le « D » de **PDF** signifie « Document ».
    answer: |
      ✅ **Vrai !** PDF signifie **Portable Document Format**, soit « format de document portable ».

  - question: |
      Vrai ou Faux : le « S » de **SMS** signifie « Super ».
    answer: |
      ❌ **Faux !** Le « S » signifie **Short** (« court »). SMS signifie **Short Message Service**, soit « service de messages courts ».

  - question: |
      Vrai ou Faux : **GPS** signifie `Global Positioning System`.
    answer: |
      ✅ **Vrai !** GPS signifie **Global Positioning System**, soit « système de positionnement mondial ».

  - question: |
      Que signifie **TTL** ?
    answer: |
      **Time To Live !** La « durée de vie » d'un paquet réseau ou d'une donnée en cache.

  - question: |
      Que signifie **ARIA** ?
    answer: |
      **Accessible Rich Internet Applications !** Des attributs qui décrivent les composants d'une page aux technologies d'assistance, comme les lecteurs d'écran.

  - question: |
      Que signifie **YAML** aujourd'hui ?
    answer: |
      **YAML Ain't Markup Language !** C'est un acronyme récursif. À sa création, en 2001, c'était Yet Another Markup Language : cette réponse-là ne compte pas.

  - question: |
      👾 **BOSS FINAL :**

      Que signifie **CAPTCHA** ?
    answer: |
      **Completely Automated Public Turing test to tell Computers and Humans Apart !** Soit « test de Turing public et entièrement automatisé pour distinguer les ordinateurs des humains ». OK si tu as cité le test de Turing. 🤖
