title: Acronymes
questions:
  - question: |
      Vrai ou Faux : le « U » de **USB** signifie « Universel ».
    answer: |
      ✅ **Vrai !** USB signifie **Universal Serial Bus**.

  - question: |
      Vrai ou Faux : le « H » de **HTML** signifie « HyperText ».
    answer: |
      ✅ **Vrai !** HTML signifie **HyperText Markup Language**.

  - question: |
      Vrai ou Faux : **CSS** signifie `Computer Style Sheets`.
    answer: |
      ❌ **Faux !** CSS signifie **Cascading Style Sheets**, soit « feuilles de style en cascade ».

  - question: |
      Vrai ou Faux : le « D » de **PDF** signifie « Document ».
    answer: |
      ✅ **Vrai !** PDF signifie **Portable Document Format**, soit « format de document portable ».

  - question: |
      Vrai ou Faux : le « S » de **SMS** signifie « Super ».
    answer: |
      ❌ **Faux !** Le « S » signifie **Short** (« court »). SMS signifie **Short Message Service**, soit « service de messages courts ».

  - question: |
      Vrai ou Faux : **GPS** signifie `Global Positioning System`.
    answer: |
      ✅ **Vrai !** GPS signifie **Global Positioning System**, soit « système de positionnement mondial ».

  - question: |
      Vrai ou Faux : **TTL** signifie `Time To Live`.
    answer: |
      ✅ **Vrai !** TTL signifie **Time To Live**.

  - question: |
      Vrai ou Faux : **ARIA** signifie `Accessible Rich Internet Applications`.
    answer: |
      ✅ **Vrai !** ARIA signifie **Accessible Rich Internet Applications**.

  - question: |
      Vrai ou Faux : **YAML** signifie aujourd'hui `Yet Another Markup Language`.
    answer: |
      ❌ **Faux !** YAML est aujourd'hui développé récursivement comme **YAML Ain't Markup Language**.

  - question: |
      👾 **BOSS FINAL — Vrai ou Faux :**

      **GNU** signifie `GNU's Not Unix`.
    answer: |
      ✅ **Vrai !** GNU signifie **GNU's Not Unix**.
