title: Culture Geek
questions:
  - question: |
      Dans l'univers de **Super Mario**, quel est le métier de Mario ?

      1. Jardinier
      2. Plombier
      3. Électricien
      4. Cuisinier
    answer: "**Plombier**. Mario est traditionnellement présenté comme un plombier, même s'il a exercé pas mal d'autres activités au fil de ses aventures ! 🍄"

  - question: |
      Quel Pokémon est devenu la mascotte emblématique de la franchise **Pokémon** ?

      1. Évoli
      2. Salamèche
      3. Pikachu
      4. Miaouss
    answer: "**Pikachu**. Le Pokémon électrique est devenu l'un des personnages les plus reconnaissables de la culture geek. ⚡"

  - question: |
      Dans **Harry Potter**, à quelle maison appartient Harry ?

      1. Serpentard
      2. Poufsouffle
      3. Serdaigle
      4. Gryffondor
    answer: "**Gryffondor**. Le Choixpeau envisage Serpentard, mais Harry demande à ne pas y être envoyé. 🪄"

  - question: |
      Dans **Star Wars**, quel est le véritable nom de Dark Vador ?

      1. Anakin Skywalker
      2. Luke Skywalker
      3. Obi-Wan Kenobi
      4. Han Solo
    answer: "**Anakin Skywalker**. Ancien Jedi, Anakin bascule du côté obscur et devient Dark Vador."

  - question: |
      Dans la saga **The Legend of Zelda**, comment s'appelle le héros que le joueur incarne généralement ?

      1. Zelda
      2. Link
      3. Ganondorf
      4. Hyrule
    answer: "**Link**. Zelda est généralement la princesse. Oui, le titre de la saga piège encore du monde. 😏"

  - question: |
      Dans **Le Seigneur des Anneaux**, comment s'appelle l'épée reforgée d'Aragorn ?

      1. Excalibur
      2. Durandal
      3. Andúril
      4. Master Sword
    answer: "**Andúril**. Elle est reforgée à partir des fragments de Narsil, l'épée d'Elendil."

  - question: |
      Quelle entreprise a commercialisé la console **Dreamcast** ?

      1. Nintendo
      2. Sony
      3. Sega
      4. Atari
    answer: "**Sega**. La Dreamcast est sortie à la fin des années 1990 et fut la dernière console de salon produite par Sega. 🎮"

  - question: |
      Dans **Pokémon Rouge et Bleu** sur Game Boy, quel professeur accompagne le joueur au début de son aventure ?

      1. Le professeur Orme
      2. Le professeur Chen
      3. Le professeur Seko
      4. Le professeur Sorbier
    answer: "**Le professeur Chen**. C'est le professeur emblématique de Kanto, appelé Professor Oak en anglais. Retour à l'époque des piles de la Game Boy ! ⚡🎮"

  - question: |
      👾 Vrai ou Faux : **Tetris** a été créé en Union soviétique dans les années 1980 et son créateur n'a pas immédiatement touché les revenus générés par le succès mondial du jeu.
    answer: |
      ✅ **Vrai !** Alexey Pajitnov a créé Tetris en 1984, mais les droits étaient initialement contrôlés par l'État soviétique.

  - question: |
      👾 Vrai ou Faux :

      Rechercher **"do a barrel roll"** sur Google déclenche un Easter egg qui fait effectuer une rotation complète à la page de résultats.
    answer: |
      ✅ **Vrai !** La page effectue une rotation à 360°.
