title: Culture Geek
questions:
  - question: |
      Dans l'univers de **Super Mario**, quel est le métier de Mario ?

      1. Jardinier
      2. Plombier
      3. Électricien
      4. Cuisinier
    answer: "**Plombier**. Mario est traditionnellement présenté comme un plombier, même s'il a exercé pas mal d'autres activités au fil de ses aventures ! 🍄"

  - question: |
      Quel Pokémon est devenu la mascotte emblématique de la franchise **Pokémon** ?

      1. Voltichou
      2. Patatachu
      3. Pikachu
      4. Grillepichu
    answer: "**Pikachu**. Le Pokémon électrique est devenu l'un des personnages les plus reconnaissables de la culture geek. ⚡"

  - question: |
      Quel animal a inspiré les pouvoirs de **Spider-Man** ?

      1. Un hamster ninja
      2. Une araignée
      3. Un pigeon radioactif
      4. Une limace supersonique
    answer: "**Une araignée**. Peter Parker obtient ses pouvoirs après avoir été mordu par une araignée. 🕷️"

  - question: |
      Dans **Star Wars**, quel est le véritable nom de Dark Vador ?

      1. Jean-Michel Sabrelaser
      2. Anakin Skywalker
      3. Dark Patate
      4. Gérard du Côté Obscur
    answer: "**Anakin Skywalker**. Ancien Jedi, Anakin bascule du côté obscur et devient Dark Vador."

  - question: |
      Dans la saga **The Legend of Zelda**, comment s'appelle le héros que le joueur incarne généralement ?

      1. Zelda
      2. Link
      3. Ganondorf
      4. Hyrule
    answer: "**Link**. Zelda est généralement la princesse. Oui, le titre de la saga piège encore du monde. 😏"

  - question: |
      Dans **Le Seigneur des Anneaux**, comment s'appelle l'épée reforgée d'Aragorn ?

      1. Excalibur
      2. Durandal
      3. Andúril
      4. Master Sword
    answer: "**Andúril**. Elle est reforgée à partir des fragments de Narsil, l'épée d'Elendil."

  - question: |
      Quelle entreprise a commercialisé la console **Dreamcast** ?

      1. Nintendo
      2. Sony
      3. Sega
      4. Atari
    answer: "**Sega**. La Dreamcast est sortie à la fin des années 1990 et fut la dernière console de salon produite par Sega. 🎮"

  - question: |
      Dans **Matrix**, que choisit Neo pour découvrir la vérité sur la Matrice ?

      1. Un cornichon fluorescent
      2. La pilule rouge
      3. Une raclette connectée
      4. Un suppositoire du futur
    answer: "**La pilule rouge**. Elle permet à Neo de découvrir la véritable nature de son monde."

  - question: |
      Dans **Retour vers le futur**, quelle vitesse la DeLorean doit-elle atteindre pour voyager dans le temps ?

      1. 77 mph
      2. 88 mph
      3. 99 mph
      4. 121 mph
    answer: "**88 mph**, soit environ **142 km/h**. Une fois cette vitesse atteinte, le convecteur temporel peut faire son petit effet. ⚡🚗"

  - question: |
      Dans **Harry Potter**, dans quel ordre apparaissent les quatre animaux sur le blason de Poudlard, de gauche à droite puis de haut en bas ?

      1. Lion, serpent, blaireau, aigle
      2. Lion, aigle, blaireau, serpent
      3. Aigle, lion, serpent, blaireau
      4. Lion, blaireau, aigle, serpent
    answer: "**Lion, serpent, blaireau, aigle** : Gryffondor, Serpentard, Poufsouffle et Serdaigle. 🪄"
