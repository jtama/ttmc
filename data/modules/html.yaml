title: HTML5
questions:
  - question: |
      Vrai ou Faux : HTML permet de structurer une page web avec des titres, des paragraphes et des images.
    answer: |
      ✅ **Vrai !** HTML décrit le contenu et la structure d'une page web. C'est la base de la page ! 🧱

  - question: |
      Vrai ou Faux : La balise `<p>` sert à créer un paragraphe.
    answer: |
      ✅ **Vrai !** On écrit par exemple `<p>Bonjour les geeks !</p>` pour créer un paragraphe. 👋

  - question: |
      Vrai ou Faux : La balise `<img>` sert à créer un bouton.
    answer: |
      ❌ **Faux !** `<img>` sert à afficher une image. Pour créer un bouton, on utilise `<button>`. 🖼️

  - question: |
      Vrai ou Faux : Un élément portant l'attribut `hidden` est normalement retiré de l'affichage de la page.
    answer: |
      ✅ **Vrai !** L'attribut `hidden` indique que l'élément n'est actuellement pas pertinent et le navigateur ne
      le rend normalement pas.

  - question: |
      Vrai ou Faux : Les éléments `<details>` et `<summary>` permettent de créer nativement un contenu dépliable sans JavaScript.
    answer: |
      ✅ **Vrai !** HTML fournit avec `<details>` et `<summary>` un composant natif ouvrable et refermable.

  - question: |
      Vrai ou Faux : Un attribut personnalisé HTML doit obligatoirement commencer par `data-` pour être utilisé avec l'API `dataset`.

      ```html
      <button data-level="10">
      Boss
      </button>
      ```
    answer: |
      ✅ **Vrai !** Les attributs `data-*` peuvent être récupérés en JavaScript via la propriété `dataset`.

  - question: |
      Dans un document HTML conforme, combien d'éléments peuvent porter le même `id` ?
    answer: |
      **Un seul !** La valeur d'un `id` doit être unique dans le document.

  - question: |
      À quel moment le script `game.js` est-il exécuté ?

      ```html
      <script src="game.js" defer></script>
      ```
    answer: |
      **Après l'analyse complète du document !** Un script classique avec `defer` est téléchargé en parallèle,
      puis exécuté une fois le HTML analysé, juste avant l'événement `DOMContentLoaded`.

  - question: |
      Quelle méthode JavaScript ouvre l'élément HTML natif `<dialog>` comme une boîte de dialogue modale ?
    answer: |
      **`showModal()` !** Elle affiche le `<dialog>` dans la couche supérieure, en mode modal. La méthode `show()`, elle, l'ouvre sans le rendre modal.

  - question: |
      👾 **BOSS FINAL :**

      Le champ email est vide. Que se passe-t-il quand ce script appelle `form.submit()` ?

      ```html
      <form id="inscription">
        <input type="email" name="email" required>
        <button type="submit">S'inscrire</button>
      </form>
      <script>
        const form = document.getElementById('inscription');
        form.submit();
      </script>
      ```
    answer: |
      **Le formulaire est envoyé quand même !** `form.submit()` contourne la validation HTML et ne déclenche pas l'événement `submit`. Pour demander une soumission avec validation et événement `submit` si les champs sont valides, on utilise `form.requestSubmit()`.
