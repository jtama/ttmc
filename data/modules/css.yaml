title: CSS
questions:
  # Niveaux 1 à 3 : très faciles
  - question: |
      Vrai ou Faux : CSS permet de modifier l'apparence d'une page web, comme les couleurs et la taille du texte.
    answer: |
      ✅ **Vrai !** CSS sert à définir la présentation des éléments HTML : couleurs, tailles, espacements et mise en page.

  - question: |
      Vrai ou Faux : Ce code affiche le texte des paragraphes en rouge.

      ```css
      p {
        color: red;
      }
      ```
    answer: |
      ✅ **Vrai !** La propriété `color` définit la couleur du texte. Ici, les paragraphes passent au rouge.

  - question: |
      Vrai ou Faux : La propriété `background-color` permet de changer la taille du texte.
    answer: |
      ❌ **Faux !** `background-color` change la couleur de fond. Pour changer la taille du texte, on utilise `font-size`.

  # Niveaux 4 à 6 : un peu moins faciles
  - question: |
      Vrai ou Faux : Le sélecteur `.hero` cible les éléments qui possèdent la classe `hero`.

      ```css
      .hero {
        font-weight: bold;
      }
      ```
    answer: |
      ✅ **Vrai !** Le point `.` indique une classe. Le sélecteur `#hero`, lui, cible un élément dont l'identifiant est `hero`.

  - question: |
      Vrai ou Faux : `padding` ajoute de l'espace à l'extérieur de la bordure d'un élément.
    answer: |
      ❌ **Faux !** `padding` ajoute de l'espace entre le contenu et la bordure. L'espace extérieur se règle avec `margin`.

  - question: |
      Vrai ou Faux : La règle suivante s'applique uniquement lorsque la largeur du viewport est inférieure ou égale à `600px`.

      ```css
      @media (max-width: 600px) {
        .menu {
          display: none;
        }
      }
      ```
    answer: |
      ✅ **Vrai !** Cette media query masque le menu lorsque la zone d'affichage mesure au maximum `600px` de large.

  # Niveaux 7 et 8 : plus difficiles
  - question: |
      Avec ce CSS, quelle est la largeur totale de la boîte, bordures comprises et hors marges ?

      ```css
      .card {
        box-sizing: border-box;
        width: 200px;
        padding: 20px;
        border: 5px solid black;
      }
      ```
    answer: |
      **`200px` !** Avec `border-box`, les bordures et le padding sont inclus dans les `200px`. La largeur du contenu est donc de `150px`.

  - question: |
      Avec ce HTML et ces deux règles, de quelle couleur sera le texte du bouton ?

      ```html
      <button id="play" class="action">Jouer</button>
      ```

      ```css
      #play { color: blue; }
      .action { color: red; }
      ```
    answer: |
      **Bleu !** Dans ces règles de même origine, sans couche ni `!important`, le sélecteur d'identifiant est plus spécifique que le sélecteur de classe. La règle rouge a beau être écrite en dernier, l'ordre d'écriture ne suffit pas à le battre.

  # Niveau 9 : difficile
  - question: |
      Avec ce CSS, de quelle couleur sera un bouton situé dans `.panel` ?

      ```css
      :where(#app .panel) button {
        color: red;
      }

      .panel button {
        color: blue;
      }
      ```
    answer: |
      **Bleu !** `:where()` et tous ses arguments apportent une spécificité nulle. La première règle a une spécificité de `0-0-1`, contre `0-1-1` pour la seconde.

  # Niveau 10 : très difficile
  - question: |
      👾 **BOSS FINAL :**

      Avec uniquement ce CSS, de quelle couleur sera un bouton `<button id="play">Jouer</button>` ?

      ```css
      @layer base, theme;

      @layer base {
        button { color: green !important; }
      }

      @layer theme {
        #play { color: red !important; }
      }

      #play { color: blue !important; }
      ```
    answer: |
      **Vert !** Pour les déclarations `!important`, l'ordre de priorité des couches est inversé : la première couche, `base`, gagne sur `theme`.

      Les déclarations importantes placées dans une couche gagnent aussi sur les déclarations importantes hors couche. La spécificité de `#play` ne change donc pas le résultat.
