title: Kubernetes
questions:
  - question: |
      Vrai ou Faux : Dans Kubernetes, un **Pod** peut contenir plusieurs conteneurs.
    answer: |
      ✅ **Vrai !** Un Pod peut contenir un ou plusieurs conteneurs qui partagent notamment le même réseau.

  - question: |
      Vrai ou Faux : Si un Pod géré par un `Deployment` disparaît, Kubernetes peut automatiquement en créer un nouveau pour le remplacer.
    answer: |
      ✅ **Vrai !** Le `Deployment` s'appuie sur un `ReplicaSet` pour maintenir le nombre de Pods souhaité.

  - question: |
      Vrai ou Faux : Un `Service` Kubernetes permet notamment de fournir un point d'accès stable à un ensemble de Pods.
    answer: |
      ✅ **Vrai !** Les Pods peuvent être recréés et changer d'adresse IP. Un `Service` fournit une manière stable de les joindre.

  - question: |
      Vrai ou Faux : Une `ConfigMap` est principalement destinée à stocker des mots de passe et des clés API sensibles.
    answer: |
      ❌ **Faux !** Une `ConfigMap` sert aux données de configuration non sensibles.

  - question: |
      Vrai ou Faux : Cette commande permet d'afficher les Pods présents dans le namespace courant.

      ```bash
      kubectl get pods
      ```
    answer: |
      ✅ **Vrai !** `kubectl get pods` affiche les Pods du namespace actuellement utilisé.

  - question: |
      Vrai ou Faux : Une `livenessProbe` permet à Kubernetes de déterminer si une application doit recevoir du trafic.
    answer: |
      ❌ **Faux !** C'est principalement le rôle de la `readinessProbe`.

  - question: |
      Deux Pods peuvent-ils porter le même nom en même temps ? À quelle condition ?
    answer: |
      **Oui, s'ils sont dans deux `Namespaces` différents !** Les noms des ressources doivent être uniques dans leur namespace, mais le même nom peut être utilisé dans un autre namespace.

  - question: |
      Que se passe-t-il si un conteneur essaie d'utiliser plus de mémoire que sa `memory limit` ?
    answer: |
      **Il est arrêté : `OOMKilled` !** La `memory limit` fixe un plafond, même si le cluster a encore de la mémoire libre. Au-delà, le noyau Linux arrête le processus, puis Kubernetes relance le conteneur selon sa politique de redémarrage.

  - question: |
      Quel objet Kubernetes peut modifier automatiquement le nombre de Pods d'une application en fonction de métriques ?
    answer: |
      **Le `HorizontalPodAutoscaler` (HPA) !** Il peut ajuster automatiquement le nombre de réplicas selon des métriques telles que l'utilisation CPU ou mémoire lorsqu'elles sont configurées et disponibles.

  - question: |
      👾 **BOSS FINAL :**

      Un `Deployment` possède **3 réplicas** et un `PodDisruptionBudget` avec `minAvailable: 3`. Ce budget bloque-t-il un `kubectl drain` du nœud qui héberge un de ces Pods ? Et une mise à jour `RollingUpdate` du Deployment avec `maxUnavailable: 1` ?
    answer: |
      **Le drain est bloqué, le rolling update ne l'est pas !** OK seulement avec les deux bonnes réponses. Un `PodDisruptionBudget` encadre les évictions passant par l'**API Eviction**, comme celles d'un `kubectl drain` : évincer un Pod ferait tomber à 2 Pods disponibles, sous le minimum de 3, donc le drain attend. Le budget ne limite pas les suppressions effectuées par le contrôleur du Deployment pendant un rolling update : c'est la stratégie `maxUnavailable` / `maxSurge` qui pilote cette mise à jour. Les Pods indisponibles pendant le rollout comptent toutefois dans le calcul du budget pour les autres évictions.
