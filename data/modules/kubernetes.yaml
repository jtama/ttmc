title: Kubernetes
questions:
  - question: |
      Vrai ou Faux : Dans Kubernetes, un **Pod** peut contenir plusieurs conteneurs.
    answer: |
      ✅ **Vrai !** Un Pod peut contenir un ou plusieurs conteneurs qui partagent notamment le même réseau.

  - question: |
      Vrai ou Faux : Si un Pod géré par un `Deployment` disparaît, Kubernetes peut automatiquement en créer un nouveau pour le remplacer.
    answer: |
      ✅ **Vrai !** Le `Deployment` s'appuie sur un `ReplicaSet` pour maintenir le nombre de Pods souhaité.

  - question: |
      Vrai ou Faux : Un `Service` Kubernetes permet notamment de fournir un point d'accès stable à un ensemble de Pods.
    answer: |
      ✅ **Vrai !** Les Pods peuvent être recréés et changer d'adresse IP. Un `Service` fournit une manière stable de les joindre.

  - question: |
      Vrai ou Faux : Une `ConfigMap` est principalement destinée à stocker des mots de passe et des clés API sensibles.
    answer: |
      ❌ **Faux !** Une `ConfigMap` sert aux données de configuration non sensibles.

  - question: |
      Vrai ou Faux : Cette commande permet d'afficher les Pods présents dans le namespace courant.

      ```bash
      kubectl get pods
      ```
    answer: |
      ✅ **Vrai !** `kubectl get pods` affiche les Pods du namespace actuellement utilisé.

  - question: |
      Vrai ou Faux : Une `livenessProbe` permet à Kubernetes de déterminer si une application doit recevoir du trafic.
    answer: |
      ❌ **Faux !** C'est principalement le rôle de la `readinessProbe`.

  - question: |
      Vrai ou Faux : Deux Pods portant le même nom peuvent exister simultanément dans deux `Namespaces` différents.
    answer: |
      ✅ **Vrai !** Les noms des ressources doivent être uniques dans leur namespace, mais le même nom peut être utilisé dans un autre namespace.

  - question: |
      Vrai ou Faux : Définir une `memory limit` signifie qu'un conteneur peut utiliser autant de mémoire qu'il veut si le cluster en possède encore.
    answer: |
      ❌ **Faux !** La `memory limit` fixe une limite de mémoire pour le conteneur.

  - question: |
      Vrai ou Faux : Un `HorizontalPodAutoscaler` peut modifier automatiquement le nombre de Pods d'une application en fonction de métriques.
    answer: |
      ✅ **Vrai !** Le HPA peut ajuster automatiquement le nombre de réplicas selon des métriques telles que l'utilisation CPU ou mémoire lorsqu'elles sont configurées et disponibles.

  - question: |
      👾 **BOSS FINAL — Vrai ou Faux :**

      Un Pod possédant les bonnes `tolerations` est **obligatoirement** déployé sur un nœud possédant les `taints` correspondants.
    answer: |
      ❌ **Faux !** Une `toleration` permet à un Pod d'être accepté sur un nœud possédant le `taint` correspondant, mais elle ne force pas Kubernetes à le placer sur ce nœud.