title: Bugs & bizarreries du Web
menu-title: Bizarreries Web
questions:
  - question: |
      Vrai ou Faux : En JavaScript, cette expression retourne `true`.

      ```javascript
      typeof null === "object"
      ```
    answer: |
      ✅ **Vrai !** `typeof null` retourne historiquement `"object"` en JavaScript.

  - question: |
      Vrai ou Faux : En HTML, oublier la balise fermante `</p>` provoque obligatoirement une erreur empêchant la page de s'afficher.
    answer: |
      ❌ **Faux !** Dans certains contextes, la balise fermante `</p>` peut être omise et le navigateur détermine automatiquement la fin du paragraphe.

  - question: |
      Vrai ou Faux : En JavaScript, ce code affiche `55`.

      ```javascript
      console.log("5" + 5);
      ```
    answer: |
      ✅ **Vrai !** Avec une chaîne de caractères, `+` effectue ici une concaténation.

  - question: |
      Vrai ou Faux : En CSS, un élément avec `z-index: 999999` sera forcément affiché au-dessus d'un élément avec `z-index: 2`.
    answer: |
      ❌ **Faux !** Deux éléments appartenant à des contextes d'empilement différents ne sont pas comparés uniquement selon la valeur de leur `z-index`.

  - question: |
      Vrai ou Faux : En JavaScript, cette comparaison retourne `true`.

      ```javascript
      0 == "0"
      ```
    answer: |
      ✅ **Vrai !** L'opérateur `==` effectue ici une conversion implicite des types.

  - question: |
      Vrai ou Faux : En HTML, écrire deux attributs `class` sur le même élément permet de fusionner automatiquement leurs valeurs.

      ```html
      <button class="btn" class="primary">
      Jouer
      </button>
      ```
    answer: |
      ❌ **Faux !** HTML n'autorise pas plusieurs attributs portant le même nom sur un même élément.

  - question: |
      En JavaScript, que vaut ce calcul ?

      ```javascript
      0.1 + 0.2
      ```
    answer: |
      **`0.30000000000000004` !** OK si tu as dit « pas exactement `0.3` ». Certains nombres décimaux ne peuvent pas être représentés exactement avec le format numérique binaire utilisé par JavaScript.

  - question: |
      En CSS, quelle différence entre `visibility: hidden` et `display: none` ?
    answer: |
      **Les deux cachent l'élément, mais `visibility: hidden` lui garde sa place dans la mise en page !** Avec `display: none`, l'élément disparaît complètement et les autres prennent sa place.

  - question: |
      En JavaScript, ce test ne détecte jamais `NaN`. Pourquoi, et que faut-il écrire à la place ?

      ```javascript
      if (x === NaN) {
        console.log("Ce n'est pas un nombre !");
      }
      ```
    answer: |
      **`NaN` n'est égal à rien, pas même à lui-même : il faut écrire `Number.isNaN(x)`.** `x === NaN` vaut toujours `false`, même quand `x` vaut `NaN`.

  - question: |
      👾 **BOSS FINAL :**

      En JavaScript, que retourne cette expression, et pourquoi ?

      ```javascript
      [] == ![]
      ```
    answer: |
      **`true` !** `![]` vaut `false`, car un tableau, même vide, est considéré comme vrai. Les conversions implicites effectuées avec `==` conduisent ensuite les deux côtés à être comparés comme la valeur numérique `0`. OK seulement avec le pourquoi.
