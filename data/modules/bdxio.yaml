title: BDX I/O
questions:
  - question: |
      Vrai ou Faux : **BDX I/O existe depuis 2014**.
    answer: |
      ✅ **Vrai !** BDX I/O rassemble la communauté tech bordelaise depuis 2014.

  - question: |
      Vrai ou Faux : BDX I/O est principalement une conférence consacrée au **jeu vidéo**.
    answer: |
      ❌ **Faux !** BDX I/O est une conférence autour de la programmation et de ses métiers annexes.

  - question: |
      Vrai ou Faux : L'organisation de BDX I/O repose sur une **équipe de bénévoles**.
    answer: |
      ✅ **Vrai !** L'événement est organisé par une équipe de bénévoles bordelais.

  - question: |
      Vrai ou Faux : BDX I/O rassemble habituellement **moins de 500 participants**.
    answer: |
      ❌ **Faux !** BDX I/O rassemble plus de 1 000 participants.

  - question: |
      Vrai ou Faux : L'édition **2025** de BDX I/O s'est déroulée au **Palais des Congrès de Bordeaux Lac**.
    answer: |
      ✅ **Vrai !** L'édition 2025 a eu lieu au Palais des Congrès de Bordeaux Lac.

  - question: |
      Vrai ou Faux : BDX I/O propose uniquement des conférences de **45 minutes**.
    answer: |
      ❌ **Faux !** Plusieurs formats existent, notamment les Quickies, conférences et Hands-on Labs.

  - question: |
      Combien de temps dure un **Quickie** à BDX I/O ?
    answer: |
      **15 minutes !** Le Quickie est le format le plus court de BDX I/O.

  - question: |
      À partir de quoi les évaluateurs de BDX I/O sélectionnent-ils les talks proposés ?
    answer: |
      **Uniquement le titre et la description du talk !** Les évaluateurs n'ont accès à rien d'autre : chaque proposition est jugée sur son contenu, pas sur la notoriété du speaker.

  - question: |
      Où se déroule l'édition **2026** de BDX I/O ?
    answer: |
      **À l'ENSEIRB-MATMECA de Talence !** BDX I/O quitte le Palais des Congrès de Bordeaux Lac, où se sont tenues les éditions 2022 à 2025.

  - question: |
      👾 **BOSS FINAL :**

      Combien de temps dure un **Hands-on Lab** à BDX I/O ?
    answer: |
      **100 minutes !** C'est le format le plus long de BDX I/O, pour mettre les mains dans le code. Les autres : la conférence (45 minutes) et le Quickie (15 minutes).
