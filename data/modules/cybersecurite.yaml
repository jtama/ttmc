title: Cybersécurité
questions:
  - question: |
      Vrai ou Faux : Si un message annonce que tu as gagné un cadeau, tu peux cliquer sur son lien sans vérifier qui l'a envoyé.
    answer: |
      ❌ **Faux !** Le message peut être une arnaque. Il faut vérifier son origine avant de cliquer.

  - question: |
      Vrai ou Faux : Verrouiller son ordinateur quand on s'absente empêche les autres de l'utiliser directement.
    answer: |
      ✅ **Vrai !** Il faut alors déverrouiller la session pour accéder à tes fichiers et applications.

  - question: |
      Vrai ou Faux : Les mises à jour servent uniquement à changer l'apparence des applications.
    answer: |
      ❌ **Faux !** Elles peuvent aussi corriger des problèmes de sécurité et mieux protéger tes appareils.

  - question: |
      Vrai ou Faux : Utiliser le même mot de passe sur tous ses comptes est une bonne idée.
    answer: |
      ❌ **Faux !** Si ce mot de passe est volé, plusieurs comptes peuvent être menacés. Il vaut mieux utiliser un mot de passe différent pour chaque compte.

  - question: |
      Vrai ou Faux : Garder une copie de ses fichiers importants sur un autre support peut aider à les récupérer si son ordinateur tombe en panne.
    answer: |
      ✅ **Vrai !** Une sauvegarde permet de retrouver ses fichiers si les originaux sont perdus ou endommagés.

  - question: |
      Vrai ou Faux : Un site frauduleux peut afficher le cadenas HTTPS dans la barre d'adresse.
    answer: |
      ✅ **Vrai !** Les certificats sont gratuits et faciles à obtenir. Le cadenas montre que la connexion est chiffrée, pas que le site est honnête.

  - question: |
      Quelle faille contient ce code, et comment la corriger ?

      ```java
      String query = "SELECT * FROM users WHERE name = '" + name + "'";
      ```
    answer: |
      **Une injection SQL !** Si `name` vaut `' OR '1'='1`, la requête renvoie tous les utilisateurs. On la corrige avec une requête paramétrée, qui envoie la valeur à part du texte SQL.

  - question: |
      Un JWT est signé avec une clé que seul le serveur connaît. Qui peut lire son contenu ?
    answer: |
      **N'importe qui !** Le contenu d'un JWT signé est seulement encodé en Base64URL : la signature empêche de le modifier, pas de le lire. Il ne faut donc jamais y mettre de secret.

  - question: |
      Ton API répond avec l'en-tête `Access-Control-Allow-Origin: https://monsite.fr`. Un script `curl` lancé depuis un autre serveur peut-il quand même l'appeler ? Pourquoi ?
    answer: |
      **Oui !** OK seulement avec le pourquoi : CORS est appliqué par le navigateur, pas par le serveur. Il empêche le JavaScript d'un autre site de lire la réponse, mais `curl` l'ignore. Pour protéger une API, il faut une vraie authentification.

  - question: |
      👾 **BOSS FINAL :**

      Ton serveur télécharge l'image dont l'utilisateur donne l'URL. Comment s'appelle cette faille, et que peut viser un attaquant ?
    answer: |
      **Une SSRF (Server-Side Request Forgery) !** L'attaquant fait appeler par ton serveur des adresses internes, inaccessibles depuis Internet. Par exemple `http://169.254.169.254/`, l'adresse des métadonnées du cloud, qui peut livrer des identifiants. C'est ainsi qu'a commencé la fuite de données de Capital One en 2019. OK si tu as dit SSRF, ou que le serveur peut appeler le réseau interne.
