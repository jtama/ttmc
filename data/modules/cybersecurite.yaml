title: Cybersécurité
questions:
  - question: |
      Vrai ou Faux : Si un message annonce que tu as gagné un cadeau, tu peux cliquer sur son lien sans vérifier qui l'a envoyé.
    answer: |
      ❌ **Faux !** Le message peut être une arnaque. Il faut vérifier son origine avant de cliquer.

  - question: |
      Vrai ou Faux : Verrouiller son ordinateur quand on s'absente empêche les autres de l'utiliser directement.
    answer: |
      ✅ **Vrai !** Il faut alors déverrouiller la session pour accéder à tes fichiers et applications.

  - question: |
      Vrai ou Faux : Les mises à jour servent uniquement à changer l'apparence des applications.
    answer: |
      ❌ **Faux !** Elles peuvent aussi corriger des problèmes de sécurité et mieux protéger tes appareils.

  - question: |
      Vrai ou Faux : Un site utilisant **HTTPS** garantit que le site est fiable et qu'il ne peut pas être frauduleux.
    answer: |
      ❌ **Faux !** HTTPS chiffre la connexion, mais ne garantit pas qu'un site est fiable.

  - question: |
      Vrai ou Faux : Un gestionnaire de mots de passe permet d'utiliser un mot de passe différent et complexe pour chaque service sans avoir à tous les mémoriser.
    answer: |
      ✅ **Vrai !** Il permet de stocker et générer des mots de passe uniques et complexes.

  - question: |
      Vrai ou Faux : L'authentification multifacteur (**MFA**) empêche absolument toute compromission d'un compte.
    answer: |
      ❌ **Faux !** Le MFA renforce la sécurité, mais ne garantit pas une protection absolue.

  - question: |
      Vrai ou Faux : Utiliser le même mot de passe sur tous ses comptes est une bonne idée.
    answer: |
      ❌ **Faux !** Si ce mot de passe est volé, plusieurs comptes peuvent être menacés. Il vaut mieux utiliser un mot de passe différent pour chaque compte.

  - question: |
      Vrai ou Faux : Garder une copie de ses fichiers importants sur un autre support peut aider à les récupérer si son ordinateur tombe en panne.
    answer: |
      ✅ **Vrai !** Une sauvegarde permet de retrouver ses fichiers si les originaux sont perdus ou endommagés.

  - question: |
      Vrai ou Faux : Une personne se présente comme le support informatique et demande ton code reçu par SMS. Tu peux le lui donner puisqu’elle connaît ton nom.
    answer: |
      ❌ **Faux !** Connaître ton nom ne prouve pas son identité. Ne partage pas le code et contacte le support par son canal habituel.

  - question: |
      👾 **BOSS FINAL — Vrai ou Faux :**

      Un pirate qui vole un cookie de session encore valide peut parfois accéder à un compte sans connaître le mot de passe ni saisir le code de double authentification.
    answer: |
      ✅ **Vrai !** Ce cookie peut servir de preuve que l'utilisateur est déjà connecté. La double authentification protège la connexion, mais ne bloque pas forcément l'utilisation d'une session volée.
