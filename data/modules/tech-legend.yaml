title: Tech Legends
questions:
  - question: |
      Vrai ou Faux : **Tim Berners-Lee** est à l'origine du World Wide Web.
    answer: |
      ✅ **Vrai !** Tim Berners-Lee a inventé le World Wide Web à la fin des années 1980.

  - question: |
      Vrai ou Faux : **Ada Lovelace**, née au XIXe siècle, a écrit un algorithme destiné à être exécuté par la machine analytique de Charles Babbage, bien avant l'apparition des ordinateurs modernes.
    answer: |
      ✅ **Vrai !** Ada Lovelace a décrit un algorithme pour la machine analytique de Charles Babbage.

  - question: |
      Vrai ou Faux : **James Gosling**, créateur de Java, est également le créateur de JavaScript.
    answer: |
      ❌ **Faux !** JavaScript a été créé par Brendan Eich.

  - question: |
      Vrai ou Faux : **Guido van Rossum** est le créateur du langage Python.
    answer: |
      ✅ **Vrai !** Guido van Rossum est à l'origine de Python.

  - question: |
      Vrai ou Faux : **Linus Torvalds** est à l'origine de Linux mais également de Git.
    answer: |
      ✅ **Vrai !** Linus Torvalds a initié Linux puis créé Git.

  - question: |
      Vrai ou Faux : **Grace Hopper** était principalement connue pour ses travaux sur les réseaux Wi-Fi.
    answer: |
      ❌ **Faux !** Grace Hopper est notamment une pionnière des compilateurs et des langages de programmation.

  - question: |
      Vrai ou Faux : **Håkon Wium Lie** a proposé CSS alors qu'il travaillait avec Tim Berners-Lee au CERN.
    answer: |
      ✅ **Vrai !** Håkon Wium Lie a proposé CSS en 1994 alors qu'il travaillait au CERN.

  - question: |
      Vrai ou Faux : **Steve Jobs** a conçu les circuits électroniques de l'**Apple I**, le premier ordinateur commercialisé par Apple.
    answer: |
      ❌ **Faux !** C'est **Steve Wozniak** qui a conçu l'Apple I. Steve Jobs a joué un rôle essentiel dans sa commercialisation. Deux Steve, mais pas le même rôle ! 🍎

  - question: |
      Vrai ou Faux : **Dennis Ritchie** est à l'origine du langage C et a également participé à la création d'Unix.
    answer: |
      ✅ **Vrai !** Dennis Ritchie a créé le langage C et contribué au développement d'Unix.

  - question: |
      👾 **BOSS FINAL — Vrai ou Faux :**

      **Radia Perlman** est parfois surnommée la "Mother of the Internet" grâce notamment à ses travaux sur le Spanning Tree Protocol.
    answer: |
      ✅ **Vrai !** Radia Perlman est notamment connue pour avoir conçu le Spanning Tree Protocol.
