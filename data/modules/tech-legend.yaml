title: Tech Legends
questions:
  - question: |
      Vrai ou Faux : **Tim Berners-Lee** est à l'origine du World Wide Web.
    answer: |
      ✅ **Vrai !** Tim Berners-Lee a inventé le World Wide Web à la fin des années 1980.

  - question: |
      Vrai ou Faux : **Ada Lovelace**, née au XIXe siècle, a écrit un algorithme destiné à être exécuté par la machine analytique de Charles Babbage, bien avant l'apparition des ordinateurs modernes.
    answer: |
      ✅ **Vrai !** Ada Lovelace a décrit un algorithme pour la machine analytique de Charles Babbage.

  - question: |
      Vrai ou Faux : **James Gosling**, créateur de Java, est également le créateur de JavaScript.
    answer: |
      ❌ **Faux !** JavaScript a été créé par Brendan Eich.

  - question: |
      Vrai ou Faux : **Guido van Rossum** est le créateur du langage Python.
    answer: |
      ✅ **Vrai !** Guido van Rossum est à l'origine de Python.

  - question: |
      Vrai ou Faux : **Linus Torvalds** est à l'origine de Linux mais également de Git.
    answer: |
      ✅ **Vrai !** Linus Torvalds a initié Linux puis créé Git.

  - question: |
      Vrai ou Faux : **Grace Hopper** était principalement connue pour ses travaux sur les réseaux Wi-Fi.
    answer: |
      ❌ **Faux !** Grace Hopper est notamment une pionnière des compilateurs et des langages de programmation.

  - question: |
      Qui a dirigé l'équipe du MIT qui a écrit le logiciel de vol des missions **Apollo**, et a popularisé l'expression « génie logiciel » ?
    answer: |
      **Margaret Hamilton !** Une photo célèbre la montre à côté des listings du code d'Apollo, empilés aussi haut qu'elle. 🚀

  - question: |
      Qui a conçu les circuits électroniques de l'**Apple I**, le premier ordinateur commercialisé par Apple ?
    answer: |
      **Steve Wozniak !** Steve Jobs a joué un rôle essentiel dans sa commercialisation. Deux Steve, mais pas le même rôle ! 🍎

  - question: |
      Qui a créé le langage C, et participé à la création d'Unix avec Ken Thompson ?
    answer: |
      **Dennis Ritchie !** Il a créé le langage C au début des années 1970 aux Bell Labs, et développé Unix avec Ken Thompson.

  - question: |
      👾 **BOSS FINAL :**

      Quelle informaticienne est parfois surnommée la « Mother of the Internet », notamment pour avoir conçu le Spanning Tree Protocol ?
    answer: |
      **Radia Perlman !** Elle est notamment connue pour avoir conçu le Spanning Tree Protocol, qui évite les boucles dans les réseaux Ethernet.
