title: Intelligence artificielle
questions:
  - question: |
      Vrai ou Faux : Une intelligence artificielle générative peut produire du contenu qu'elle n'a jamais vu exactement sous cette forme pendant son entraînement.
    answer: |
      ✅ **Vrai !** Une IA générative apprend des régularités à partir de ses données d'entraînement et peut générer de nouveaux contenus à partir de ce qu'elle a appris.

  - question: |
      Vrai ou Faux : En apprentissage supervisé, le modèle apprend à partir d'exemples associés à des réponses ou des labels attendus.
    answer: |
      ✅ **Vrai !** Les données d'entraînement contiennent des exemples accompagnés de la réponse attendue.

  - question: |
      Vrai ou Faux : Lorsqu'une IA "hallucine", cela signifie qu'elle refuse de répondre à une question.
    answer: |
      ❌ **Faux !** Une hallucination correspond à une réponse générée qui peut sembler crédible mais qui contient des informations fausses, inventées ou non étayées.

  - question: |
      Vrai ou Faux : Pour un modèle de langage, un `token` correspond obligatoirement à un mot entier.
    answer: |
      ❌ **Faux !** Un token peut correspondre à un mot, une partie de mot, un signe de ponctuation ou d'autres fragments de texte selon la tokenisation utilisée.

  - question: |
      Vrai ou Faux : Un `embedding` permet de représenter une information sous la forme d'un vecteur numérique.
    answer: |
      ✅ **Vrai !** Les embeddings représentent des éléments comme des textes sous forme de vecteurs.

  - question: |
      Vrai ou Faux : Dans un système de type `RAG`, le modèle doit obligatoirement être réentraîné chaque fois qu'un nouveau document est ajouté à la base documentaire.
    answer: |
      ❌ **Faux !** Le **Retrieval-Augmented Generation** permet de rechercher des informations pertinentes dans une source externe puis de les fournir au modèle comme contexte.

  - question: |
      Vrai ou Faux : Augmenter la `temperature` d'un modèle de langage tend généralement à rendre ses réponses plus déterministes.
    answer: |
      ❌ **Faux !** Une température plus élevée tend généralement à augmenter la diversité des sorties.

  - question: |
      Vrai ou Faux : Le `fine-tuning` et le `prompt engineering` désignent exactement la même technique.
    answer: |
      ❌ **Faux !** Le **prompt engineering** consiste à travailler les instructions et le contexte fournis au modèle.

  - question: |
      Vrai ou Faux : Si les données utilisées pour entraîner un modèle contiennent des biais, le modèle peut apprendre et reproduire certains de ces biais.
    answer: |
      ✅ **Vrai !** Les modèles apprennent à partir de données et celles-ci peuvent contenir des biais ou des déséquilibres.

  - question: |
      👾 **BOSS FINAL — Vrai ou Faux :**

      Lorsqu'un **LLM** génère une réponse, il consulte automatiquement une base contenant la réponse exacte puis choisit les mots à afficher.
    answer: |
      ❌ **Faux !** Un LLM génère du texte en prédisant successivement des tokens à partir du contexte et des paramètres appris pendant son entraînement.
