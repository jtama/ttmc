title: Intelligence artificielle
questions:
  - question: |
      Vrai ou Faux : Une intelligence artificielle peut aider à écrire un texte.
    answer: |
      ✅ **Vrai !** Elle peut proposer un brouillon de message, une histoire ou un résumé.

  - question: |
      Vrai ou Faux : Une intelligence artificielle est forcément un robot avec des bras et des jambes.
    answer: |
      ❌ **Faux !** Une IA peut être un logiciel utilisé sur un ordinateur ou un téléphone, sans corps de robot.

  - question: |
      Vrai ou Faux : Lorsqu'une IA "hallucine", cela signifie qu'elle refuse de répondre à une question.
    answer: |
      ❌ **Faux !** Une hallucination correspond à une réponse générée qui peut sembler crédible mais qui contient des informations fausses, inventées ou non étayées.

  - question: |
      Vrai ou Faux : Une IA peut aider à traduire un texte dans une autre langue.
    answer: |
      ✅ **Vrai !** Elle peut proposer une traduction, mais il reste utile de vérifier le résultat.

  - question: |
      Vrai ou Faux : Une IA devine toujours ce que tu veux, même si ta demande est très vague.
    answer: |
      ❌ **Faux !** Une demande claire et précise l'aide à donner une réponse plus adaptée.

  - question: |
      Vrai ou Faux : Une image créée par une IA peut montrer une scène qui n'a jamais eu lieu.
    answer: |
      ✅ **Vrai !** Une IA peut inventer une image réaliste. Ce n'est donc pas forcément la preuve d'un événement réel.

  - question: |
      Qu'est-ce que change une `temperature` plus élevée pour un modèle de langage ?
    answer: |
      **Des réponses plus variées, moins prévisibles !** Une température plus élevée tend généralement à augmenter la diversité des sorties. Une température basse les rend plus déterministes.

  - question: |
      Comment s'appelle la technique qui va chercher des documents pertinents et les ajoute au prompt avant que le modèle génère sa réponse ?
    answer: |
      **Le RAG (Retrieval-Augmented Generation) !** Le modèle répond à partir de documents récupérés au moment de la question, par exemple la documentation de ton entreprise, sans avoir été réentraîné dessus. OK si tu as dit « RAG ».

  - question: |
      Quelle différence entre le `fine-tuning` et le `prompt engineering` ?
    answer: |
      **Le fine-tuning modifie le modèle, le prompt engineering seulement ce qu'on lui demande !** Le **fine-tuning** réentraîne un modèle sur des données choisies, ce qui change ses poids. Le **prompt engineering** consiste à travailler les instructions et le contexte fournis au modèle, sans le modifier.

  - question: |
      👾 **BOSS FINAL :**

      Quel est le titre de l'article scientifique de 2017 qui a introduit l'architecture **Transformer**, le « T » de GPT ?
    answer: |
      **« Attention Is All You Need » !** Publié en 2017 par Ashish Vaswani et ses collègues de Google, il décrit le mécanisme d'attention qui permet à chaque mot de tenir compte de tous les autres. Presque tous les grands modèles de langage actuels en descendent.
