title: JavaScript
questions:
  - question: |
      Vrai ou Faux : JavaScript permet de rendre une page web interactive, par exemple en réagissant à un clic sur un bouton.
    answer: |
      ✅ **Vrai !** JavaScript permet d'ajouter des actions à une page web : cliquer, jouer ou afficher un message. 🎮

  - question: |
      Vrai ou Faux : En JavaScript, le calcul `2 + 3` donne `5`.
    answer: |
      ✅ **Vrai !** Le signe `+` permet ici d'additionner deux nombres : `2 + 3` donne bien `5`. 🧮

  - question: |
      Vrai ou Faux : JavaScript et Java sont deux noms pour le même langage.
    answer: |
      ❌ **Faux !** JavaScript et Java sont deux langages différents, malgré leurs noms qui se ressemblent. ☕

  - question: |
      Vrai ou Faux : Après ce code, Batman a disparu du tableau :

      ```javascript
      const heroes = ["Batman", "Spider-Man", "Deadpool"];
      heroes.shift();
      ```
    answer: |
      ✅ **Vrai !** `shift()` retire le premier élément du tableau. Batman est donc parti bouder dans sa Batcave. 🦇

  - question: |
      Vrai ou Faux : Ce code affiche `55` :

      ```javascript
      console.log("5" + 5);
      ```
    answer: |
      ✅ **Vrai !** Comme l'une des valeurs est une chaîne de caractères, JavaScript effectue une concaténation et affiche `"55"`.

  - question: |
      Vrai ou Faux : Ce code affiche `true` :

      ```javascript
      console.log(0 == false);
      ```
    answer: |
      ✅ **Vrai !** Avec `==`, JavaScript effectue une conversion implicite des types. Avec `0 === false`, le résultat serait `false`. JavaScript commence à jouer avec nos nerfs. 😈

  - question: |
      Vrai ou Faux : Ce code provoque une erreur :

      ```javascript
      const snacks = ["🍕", "🍔"];
      snacks.push("🍪");
      ```
    answer: |
      ❌ **Faux !** Même déclaré avec `const`, le contenu d'un tableau peut être modifié. On ne peut simplement pas réassigner `snacks` à un autre tableau. Le cookie est sauvé. 🍪

  - question: |
      Vrai ou Faux : Ce code affiche `true` deux fois :

      ```javascript
      const tableau = new Array(3);
      const resultat = tableau.map(() => 42);

      console.log(resultat.length === 3);
      console.log(resultat[0] === 42);
      ```
    answer: |
      ❌ **Faux !** Il affiche **true**, puis **false**. `new Array(3)` crée un tableau de longueur 3 avec des cases absentes. `map()` ne les visite pas : le résultat conserve ces cases absentes et `resultat[0]` vaut `undefined`.

  - question: |
      Vrai ou Faux : Ce code affiche `10`, car l'opérateur `...` crée une copie indépendante de toutes les données :

      ```javascript
      const joueur = { stats: { score: 10 } };
      const copie = { ...joueur };
      copie.stats.score = 99;

      console.log(joueur.stats.score);
      ```
    answer: |
      ❌ **Faux !** Il affiche **99**. L'opérateur `...` effectue une copie superficielle : `joueur` et `copie` partagent encore le même objet `stats`. Modifier son score affecte donc les deux.

  - question: |
      👾 **BOSS FINAL — Vrai ou Faux :**

      Ce code affiche **A**, puis **B**, puis **C**.

      ```javascript
      Promise.resolve("A")
        .finally(() => Promise.reject("B"))
        .then(valeur => console.log(valeur))
        .catch(erreur => console.log(erreur))
        .then(() => console.log("C"));
      ```
    answer: |
      ❌ **Faux !** Il affiche uniquement **B**, puis **C**. Un `finally()` qui se termine normalement conserve le résultat initial, mais ici il retourne une promesse rejetée : le rejet **B** remplace la résolution **A**. Le premier `then()` est ignoré, `catch()` affiche **B** et rétablit une promesse résolue, puis le dernier `then()` affiche **C**.
