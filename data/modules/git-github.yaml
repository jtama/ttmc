title: Git & GitHub
questions:
  - question: |
      Vrai ou Faux : Après avoir modifié un fichier, `git add` enregistre définitivement ces modifications dans l'historique Git.
    answer: |
      ❌ **Faux !** `git add` place les modifications dans la zone de staging ; c'est le `commit` qui les ajoute à l'historique.

  - question: |
      Vrai ou Faux : Dans Git, `HEAD` désigne généralement le commit actuellement checkouté, souvent via la branche courante.
    answer: |
      ✅ **Vrai !** `HEAD` représente la position actuellement checkoutée dans l'historique Git.

  - question: |
      Vrai ou Faux : Ajouter un fichier dans `.gitignore` suffit à arrêter automatiquement son suivi s'il a déjà été ajouté et commité.
    answer: |
      ❌ **Faux !** `.gitignore` n'arrête pas automatiquement le suivi d'un fichier déjà suivi par Git.

  - question: |
      Vrai ou Faux : `git revert` permet d'annuler les modifications d'un ancien commit en créant un nouveau commit.
    answer: |
      ✅ **Vrai !** `git revert` crée un nouveau commit qui inverse les modifications ciblées.

  - question: |
      Vrai ou Faux : Supprimer une branche Git entraîne automatiquement la suppression des commits qui ont été fusionnés dans une autre branche.
    answer: |
      ❌ **Faux !** Les commits restent accessibles depuis les autres branches qui les référencent.

  - question: |
      Vrai ou Faux : Un `git rebase` peut réécrire l'historique en recréant des commits avec de nouveaux identifiants.
    answer: |
      ✅ **Vrai !** Un rebase peut recréer les commits et donc modifier leurs hashes.

  - question: |
      Sur GitHub, quelle différence entre un **fork** et une **branche** ?
    answer: |
      **Un fork est une copie du dépôt, une branche vit dans le dépôt !** Un fork copie un dépôt dans un autre espace GitHub, tandis qu'une branche est une ligne de développement à l'intérieur d'un dépôt.

  - question: |
      Quelle commande Git permet d'appliquer un commit précis d'une autre branche sur la branche courante ?
    answer: |
      **`git cherry-pick` !** Elle applique les modifications introduites par un commit spécifique, dans un nouveau commit.

  - question: |
      Tu es sur `main`. Après cette commande, où sont passées les modifications du dernier commit ?

      ```bash
      git reset --soft HEAD~1
      ```
    answer: |
      **Toujours là, dans la zone de staging !** `--soft` fait reculer `main` d'un commit, mais garde les modifications, prêtes à être commitées à nouveau.

  - question: |
      👾 **BOSS FINAL :**

      Tu checkoutes directement un commit, puis tu crées un nouveau commit sans créer de branche :

      ```bash
      git checkout a1b2c3d
      git commit -am "Mon super commit"
      git checkout main
      ```

      Que devient « Mon super commit » ?
    answer: |
      **Il n'appartient à aucune branche !** On était en `detached HEAD` : le commit n'a été rattaché ni à `main` ni à une autre branche. En revenant sur `main`, on le laisse derrière, et Git le supprimera un jour. On peut encore le retrouver avec `git reflog` et lui créer une branche.