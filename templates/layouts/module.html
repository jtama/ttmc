---
layout: default
---

<div class="main-layout">
    {#include partials/menu.html /}
    <main>


        <div class="levels-grid">
            {#for item in page.data.questions}
            <button class="level-btn
                    {#if item_count <= 3} level-btn--beginner{/if}
                    {#if item_count >= 4 && item_count <= 6} level-btn--intermediate{/if}
                    {#if item_count >= 7 && item_count <= 8} level-btn--advanced{/if}
                    {#if item_count == 9} level-btn--expert{/if}
                    {#if item_count == 10} level-btn--boss{/if}"
                    data-index="{item_index}" title="Révèle la question {item_count}" style="grid-column: {item_count.mod(5)};">
                Niveau {item_count}
            </button>
            {/for}
        </div>
        <div id="question-container" style="display:none;"></div>

        {#for item in page.data.questions}
        <div id="question-{item_index}" class="question-card" style="display:none;">
            <div class="question-text"><p>{#markdown}{item.question.raw}{/markdown}</p></div>
            <div class="answer-text" style="display:none;">{#markdown}{item.answer.raw}{/markdown}</p></div>
            <div class="button-group">
                <button class="show-answer-btn">Voir la réponse</button>
                <button class="ok-btn" data-points="{item_count}" style="display:none;" disabled>OK</button>
                <button class="error-btn" style="display:none;" disabled>Error</button>
            </div>
        </div>
        {/for}
    </main>
</div>
