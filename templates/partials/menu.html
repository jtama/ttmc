<aside>
    <nav>
        <ul>
            <li><strong>Modules</strong></li>
        </ul>
        <ul>
        {#for module in site.collections.get('modules').alphabetical}
            <li><a href="{module.url}" data-module-link title="{module.title}">{#if module.data.containsKey('menu-title')}{module.data.get('menu-title')}{#else}{module.title}{/if}</a></li>
        {/for}
        </ul>
    </nav>
</aside>
