---
title: "HIGH SCORES <br> Qui règne sur la cour de récré ?"
html-title: true
title-trophy: true
layout: default
---
<div class="container leaderboard-page">
    <main>

        <!-- Section Quiz en cours -->
        <div id="quiz-in-progress">
            <h2 id="current-quiz-title">🎯 Quiz en cours'</h2>
            <div class="current-quizz" id="current-quiz-content" style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                <div>
                    <p><strong>Joueur :</strong> <span class="player-name-display"></span></p>
                    <p><strong>Score actuel :</strong> <span class="current-score-display"></span> points</p>
                    <p><strong>Modules complétés :</strong> <span class="modules-progress"></span></p>
                </div>
                <div>
                    <p><strong>Modules restants :</strong></p>
                    <ul class="remaining-modules-list" style="margin: 5px 0; padding-left: 20px;">
                    </ul>
                </div>
                <div class="btn-actions-quizz">
                    <button class="force-finish-btn"
                            onclick="leaderboard.forceFinishQuiz({site.collections.modules.collectionTitles.raw})">
                        💾 Terminer le quiz (0 pts pour les modules restants)
                    </button>
                    <button class="continue-quiz-btn"
                            onclick="leaderboard.continueQuiz()">
                        🕹️ Continuer le quiz
                    </button>
                </div>
            </div>
        </div>

        <!-- Section Leaderboard -->
        <div class="leaderboard-section" id="leaderboard"
             data-modules="{site.collections.modules.collectionTitles.raw}">
            <h2>🥇 Classement</h2>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Joueur</th>
                    <th scope="col">Score</th>
                </tr>
                </thead>
                <tbody id="leaderboard-list">
                <!-- Les scores seront ajoutés ici par JavaScript -->
                </tbody>
            </table>

            <template id="leaderboard-row-template">
                <tr>
                    <th scope="row"></th>
                    <td></td>
                    <td></td>
                </tr>
            </template>
        </div>

        <div class="navigation">
            <button id="clear-storage-btn" class="button primary"> ☠️&nbsp; RESET GAME</button>
        </div>
    </main>
</div>

<script type="module">
    addEventListener("load", () => leaderboard.initLeaderboardPage({site.collections.modules.size()}));
</script>
